<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NimbusX - Weather Forecast</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo">&#9925; NimbusX</div>
        <p class="tagline">Real-Time Weather Forecast</p>
    </header>

    <main class="container">
        <section class="search-section">
            <input type="text" id="cityInput" placeholder="Enter city name (e.g., London, Mumbai, Tokyo)" />
            <button id="searchBtn">Get Weather</button>
        </section>

        <div id="loading" class="hidden">Loading weather data...</div>
        <div id="error" class="hidden"></div>

        <section id="currentWeather" class="hidden">
            <h2 id="cityName"></h2>
            <div class="current-grid">
                <div class="weather-main">
                    <img id="weatherIcon" src="" alt="Weather icon" />
                    <span id="temperature" class="temp-value"></span>
                    <span id="description" class="desc"></span>
                </div>
                <div class="weather-details">
                    <div class="detail-card">
                        <span class="detail-label">Humidity</span>
                        <span id="humidity" class="detail-value"></span>
                    </div>
                    <div class="detail-card">
                        <span class="detail-label">Wind Speed</span>
                        <span id="windSpeed" class="detail-value"></span>
                    </div>
                </div>
            </div>
        </section>

        <section id="forecast" class="hidden">
            <h3>5-Day Forecast</h3>
            <div id="forecastCards" class="forecast-grid"></div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 NimbusX Weather Application. Built by Bhavini Awasthi</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
